appId: com.agentcontroller.app
productName: Agent Controller
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!native/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!svelte.config.mjs'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: native/.build/release/AgentControllerBridge
    to: native/AgentControllerBridge
asarUnpack:
  - resources/**
win:
  executableName: agent-controller
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # A list here lands in Info.plist as "0"/"1"/"2" sub-dictionaries and macOS
  # never sees the strings: extendInfo must be a mapping.
  extendInfo:
    NSMicrophoneUsageDescription: Agent Controller records from the DualSense microphone only while you hold the mic button.
    NSSpeechRecognitionUsageDescription: Agent Controller transcribes what you say so it can be sent to the selected session.
    NSBluetoothAlwaysUsageDescription: Agent Controller connects to the DualSense over Bluetooth.
  # Runs only when notarytool credentials are in the environment (see the
  # release notes in the README); without them the build just warns and skips.
  notarize: true
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
